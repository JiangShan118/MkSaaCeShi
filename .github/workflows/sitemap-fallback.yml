name: Sitemap fallback monitor
# Manual rerun marker: 2026-10-10

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sitemap-fallback.yml
      - scripts/github-fallback.mjs
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sitemap-fallback-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/github-fallback.mjs
        env:
          MONITOR_BASE: https://sitemap-monitor-worker.dayue1068.workers.dev



name: Sitemap cloud probe

on:
  push:
    branches: [sitemap-cloud-probe-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch sitemap from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          target='https://vbdramas.com/wp-sitemap-posts-page-1.xml'
          status=$(curl --silent --show-error --location --max-redirs 5 --max-time 30 \
            --user-agent 'SitemapMonitor/1.0 (+https://example.invalid/monitor)' \
            --header 'Accept: application/xml,text/xml,text/plain' \
            --dump-header headers.txt --output response.bin --write-out '%{http_code}' "$target")
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); sub(/\r$/, "", value); print value}' headers.txt)
          loc_count=$(grep -ao '<loc>' response.bin | wc -l | tr -d ' ')
          if grep -aq '<urlset\|<sitemapindex' response.bin; then valid_xml=yes; else valid_xml=no; fi
          printf 'status=%s\ncontent_type=%s\nloc_count=%s\nvalid_sitemap=%s\n' "$status" "$content_type" "$loc_count" "$valid_xml"
          test "$status" = '200'
          test "$valid_xml" = 'yes'
          test "$loc_count" -gt 0
